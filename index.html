<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brasileirão - Séries A, B, C e D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div id="goal-notif-wrap" class="goal-notif-wrap"></div>

    <header class="site-header">
        <span class="trophy">🏆</span>
        <h1>Brasilei<span>rão</span></h1>
        <div class="header-sub">
            <div class="current-date" id="display-date">Carregando...</div>
        </div>
    </header>

    <main class="main-content">

        <!-- Seletor de série: A · B · C · D -->
        <nav class="serie-bar" id="serie-bar" aria-label="Selecionar série"></nav>

        <div class="section" id="today-section">
            <div class="section-title">⚽ Jogos de Hoje <span class="section-serie" id="today-serie-label"></span></div>
            <div class="dashboard" id="today-dashboard">
                <div class="loading">Carregando jogos...</div>
            </div>
        </div>

        <div class="toggle-bar" id="toggle-bar" style="display:none;">
            <button class="toggle-btn" id="btn-past" type="button" disabled>
                📋 Resultados Anteriores <span class="btn-count" id="count-past">0</span>
            </button>
            <button class="toggle-btn" id="btn-upcoming" type="button" disabled>
                📅 Próximos Jogos <span class="btn-count" id="count-upcoming">0</span>
            </button>
            <button class="toggle-btn" id="btn-standings" type="button">
                📊 Classificação
            </button>
            <button class="toggle-btn" id="btn-scorers" type="button">
                ⚽ Artilheiros
            </button>
        </div>

        <div class="section" id="past-section" style="display:none;">
            <div class="section-title">📋 Resultados Anteriores</div>
            <div id="past-dashboard"></div>
        </div>

        <div class="section" id="upcoming-section" style="display:none;">
            <div class="section-title">📅 Próximos Jogos</div>
            <div id="upcoming-dashboard"></div>
        </div>

        <div class="section" id="scorers-section" style="display:none;">
            <div class="section-title">⚽ Artilheiros</div>
            <div class="scorers-card">
                <div id="scorers-container"></div>
            </div>
        </div>

        <div class="section" id="standings-section" style="display:none;">
            <div class="section-title">📊 Classificação</div>
            <div id="standings-container"></div>
            <div class="standings-legend" id="standings-legend"></div>
        </div>

    </main>

    <footer class="site-footer">
        Dados: <strong>ESPN</strong> (placares, tabelas e escudos) · sem chave e sem limite de requisições
    </footer>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
