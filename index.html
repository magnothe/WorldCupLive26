<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Cup 2026 - Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>
        html { scroll-behavior: smooth; }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --gold:   #f59e0b;
            --orange: #f97316;
            --blue:   #3b82f6;
            --purple: #8b5cf6;
            --green:  #22c55e;
            --red:    #ef4444;
            --card-bg:     rgba(255,255,255,0.055);
            --card-border: rgba(255,255,255,0.10);
            --text-hi:  rgba(255,255,255,0.94);
            --text-mid: rgba(255,255,255,0.52);
            --text-lo:  rgba(255,255,255,0.26);
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            -webkit-overflow-scrolling: touch;
            background:
                radial-gradient(ellipse 90% 55% at 5%   0%,  rgba(59,130,246,0.13)  0%, transparent 55%),
                radial-gradient(ellipse 70% 45% at 95% 100%, rgba(139,92,246,0.10)  0%, transparent 55%),
                radial-gradient(ellipse 60% 40% at 50%  60%, rgba(245,158,11,0.05)  0%, transparent 55%),
                #06090f;
            min-height: 100vh;
            color: var(--text-hi);
        }

        /* ══════════════════════════════
           HEADER
        ══════════════════════════════ */
        .site-header {
            position: relative;
            overflow: hidden;
            text-align: center;
            padding: 52px 20px 60px;
            background:
                radial-gradient(ellipse 140% 200% at 50% 160%, rgba(245,158,11,0.18) 0%, transparent 50%),
                radial-gradient(ellipse  90% 120% at  5% -10%, rgba(59,130,246,0.22)  0%, transparent 50%),
                linear-gradient(180deg, #0b1220 0%, #0e1728 100%);
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        /* linha dourada no bottom */
        .site-header::after {
            content: '';
            position: absolute;
            bottom: 0; left: 10%; right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(245,158,11,0.6), transparent);
        }
        /* orb decorativo atrás do troféu */
        .site-header::before {
            content: '';
            position: absolute;
            width: 360px; height: 360px;
            border-radius: 50%;
            top: -130px; left: 50%;
            transform: translateX(-50%);
            background: radial-gradient(circle, rgba(245,158,11,0.10) 0%, transparent 70%);
            pointer-events: none;
        }

        .trophy {
            font-size: 3.2rem;
            display: block;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 22px rgba(245,158,11,0.55));
            animation: floatTrophy 3.2s ease-in-out infinite;
        }
        @keyframes floatTrophy {
            0%, 100% { transform: translateY(0px);   }
            50%       { transform: translateY(-8px); }
        }

        .site-header h1 {
            font-size: 2.4rem;
            font-weight: 900;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 2px 30px rgba(255,255,255,0.12);
        }
        .site-header h1 span {
            background: linear-gradient(90deg, var(--gold), var(--orange));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header-sub {
            margin-top: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }
        .header-sub::before,
        .header-sub::after {
            content: '';
            width: 40px; height: 1px;
            background: rgba(255,255,255,0.20);
        }
        .current-date {
            color: var(--text-mid);
            font-size: 0.76rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* ══════════════════════════════
           LAYOUT
        ══════════════════════════════ */
        .main-content {
            max-width: 1280px;
            margin: 0 auto;
            padding: 44px 20px 88px;
        }

        .section { margin-bottom: 56px; }

        .section-title {
            font-size: 0.66rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--gold);
            margin-bottom: 26px;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, rgba(245,158,11,0.35), transparent);
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 440px));
            gap: 20px;
            justify-content: center;
        }

        /* ══════════════════════════════
           CARD
        ══════════════════════════════ */
        .scoreboard-card {
            background: var(--card-bg);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--card-border);
            border-radius: 22px;
            padding: 22px 22px 18px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            overflow: hidden;
            transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
            animation: fadeUp 0.38s ease both;
        }
        /* barra superior — jogos de hoje */
        .scoreboard-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--blue), var(--purple));
        }
        /* brilho interno sutil */
        .scoreboard-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 22px;
            background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(255,255,255,0.04) 0%, transparent 70%);
            pointer-events: none;
        }
        .scoreboard-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255,255,255,0.18);
            box-shadow: 0 12px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.06);
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Card header ── */
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .title {
            font-size: 0.62rem;
            font-weight: 700;
            color: var(--text-lo);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .match-time {
            font-size: 0.70rem;
            font-weight: 600;
            color: var(--gold);
            background: rgba(245,158,11,0.12);
            border: 1px solid rgba(245,158,11,0.22);
            padding: 3px 11px;
            border-radius: 20px;
            white-space: nowrap;
        }

        /* ── Teams & score ── */
        .match-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .team-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .flag-ring {
            border-radius: 10px;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 4px 18px rgba(0,0,0,0.40);
            transition: box-shadow 0.2s ease, transform 0.2s ease;
        }
        .scoreboard-card:hover .flag-ring {
            box-shadow: 0 6px 24px rgba(59,130,246,0.30);
            transform: scale(1.05);
        }
        .flag { width: 80px; height: 54px; object-fit: cover; display: block; }
        .team-name {
            font-size: 0.80rem;
            font-weight: 700;
            color: var(--text-hi);
            text-align: center;
            word-break: break-word;
            line-height: 1.2;
        }

        .score-wrapper { text-align: center; flex-shrink: 0; }
        .score-display {
            font-family: 'Bebas Neue', 'Inter', sans-serif;
            font-size: 3.4rem;
            font-weight: 400;
            letter-spacing: 2px;
            line-height: 1;
            background: linear-gradient(135deg, #f59e0b 0%, #f97316 60%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 2px 12px rgba(245,158,11,0.30));
        }

        /* ── Scorers ── */
        .scorers-container {
            display: flex;
            gap: 10px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 0.70rem;
            line-height: 1.75;
        }
        .scorers-side { flex: 1; color: var(--text-mid); word-break: break-word; }
        .scorers-side.away { text-align: right; }

        /* ── FIFA code ── */
        .team-code {
            font-size: 0.60rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--text-lo);
            text-transform: uppercase;
        }

        /* ── Stadium info ── */
        .card-stadium {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 0.62rem;
            color: var(--text-lo);
            background: rgba(255,255,255,0.025);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 6px 12px;
            text-align: center;
            flex-wrap: wrap;
        }
        .card-stadium .stadium-sep {
            opacity: 0.3;
        }
        .card-stadium .stadium-cap {
            color: var(--gold);
            font-weight: 600;
        }

        /* ── Card footer ── */
        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .status {
            font-size: 0.60rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--green);
            background: rgba(34,197,94,0.12);
            border: 1px solid rgba(34,197,94,0.22);
        }
        .status.live {
            color: #fff;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            border-color: transparent;
            box-shadow: 0 0 18px rgba(239,68,68,0.45);
            animation: livePulse 1.4s ease-in-out infinite;
        }
        @keyframes livePulse {
            0%, 100% { box-shadow: 0 0 18px rgba(239,68,68,0.45); }
            50%       { box-shadow: 0 0 28px rgba(239,68,68,0.75); }
        }
        .update-time {
            font-size: 0.58rem;
            color: var(--text-lo);
        }

        /* ══════════════════════════════
           CARD VARIANTS (accent bars)
        ══════════════════════════════ */
        #past-section .scoreboard-card::before {
            background: linear-gradient(90deg, #475569, #64748b);
            opacity: 0.7;
        }
        #upcoming-section .scoreboard-card::before {
            background: linear-gradient(90deg, var(--gold), var(--orange));
        }

        /* ══════════════════════════════
           TOGGLE BAR
        ══════════════════════════════ */
        .toggle-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }
        .toggle-btn {
            font-family: 'Inter', sans-serif;
            font-size: 0.70rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 11px 22px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.05);
            color: var(--text-mid);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(10px);
        }
        .toggle-btn:hover:not(:disabled) {
            border-color: rgba(255,255,255,0.25);
            color: var(--text-hi);
            background: rgba(255,255,255,0.09);
        }
        #btn-past.active {
            background: linear-gradient(135deg, #334155, #475569);
            border-color: rgba(255,255,255,0.15);
            color: #fff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        #btn-upcoming.active {
            background: linear-gradient(135deg, var(--gold), var(--orange));
            border-color: transparent;
            color: #fff;
            box-shadow: 0 4px 20px rgba(245,158,11,0.40);
        }
        .toggle-btn:disabled { opacity: 0.30; cursor: not-allowed; }
        .btn-count {
            padding: 1px 8px;
            border-radius: 20px;
            font-size: 0.60rem;
            background: rgba(255,255,255,0.10);
            color: var(--text-mid);
        }
        .toggle-btn.active .btn-count {
            background: rgba(255,255,255,0.20);
            color: #fff;
        }

        /* ══════════════════════════════
           DATE GROUP
        ══════════════════════════════ */
        .date-group { margin-bottom: 34px; }
        .date-group-header {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--text-mid);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 16px;
            padding: 6px 14px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        /* ══════════════════════════════
           EMPTY / LOADING / ERROR
        ══════════════════════════════ */
        .no-games, .loading, .error {
            grid-column: 1 / -1;
            text-align: center;
            padding: 56px 20px;
            color: var(--text-mid);
            font-size: 0.88rem;
            font-weight: 500;
            background: rgba(255,255,255,0.03);
            border-radius: 20px;
            border: 1px dashed rgba(255,255,255,0.10);
        }
        .error {
            color: var(--red);
            border-color: rgba(239,68,68,0.25);
            background: rgba(239,68,68,0.05);
        }

        /* ══════════════════════════════
           STANDINGS
        ══════════════════════════════ */
        #btn-standings.active {
            background: linear-gradient(135deg, var(--green), #16a34a);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 4px 20px rgba(34,197,94,0.40);
        }

        .standings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(460px, 1fr));
            gap: 22px;
        }

        .group-table {
            background: var(--card-bg);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--card-border);
            border-radius: 22px;
            overflow: hidden;
            animation: fadeUp 0.38s ease both;
            position: relative;
        }
        .table-scroll-wrap {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .group-table::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--green), var(--blue));
        }

        .group-table-header {
            padding: 14px 18px 12px;
            background: rgba(255,255,255,0.04);
            border-bottom: 1px solid rgba(255,255,255,0.07);
            font-size: 0.68rem;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--gold);
        }

        .standings-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.78rem;
            min-width: 420px;
        }
        .standings-table thead th {
            padding: 7px 8px;
            text-align: center;
            font-size: 0.58rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-lo);
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .standings-table thead th.col-team { text-align: left; }
        .standings-table tbody tr {
            border-bottom: 1px solid rgba(255,255,255,0.04);
            transition: background 0.15s ease;
        }
        .standings-table tbody tr:last-child { border-bottom: none; }
        .standings-table tbody tr:hover { background: rgba(255,255,255,0.04); }
        .standings-table tbody td {
            padding: 9px 8px;
            text-align: center;
            color: var(--text-mid);
            white-space: nowrap;
        }
        .standings-table tbody td.col-team { text-align: left; }

        .st-pos {
            font-weight: 700;
            font-size: 0.70rem;
            width: 28px;
            color: var(--text-lo);
        }
        .st-pos.qualify { color: var(--green); }
        .st-pos.playoff { color: var(--gold); }

        .st-team-cell {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 130px;
        }
        .st-flag {
            width: 28px;
            height: 19px;
            object-fit: cover;
            border-radius: 3px;
            flex-shrink: 0;
            box-shadow: 0 1px 6px rgba(0,0,0,0.40);
        }
        .st-name {
            font-weight: 600;
            color: var(--text-hi);
            font-size: 0.78rem;
        }
        .st-pts {
            font-weight: 800;
            font-size: 0.86rem;
            color: var(--text-hi);
        }
        .st-gd { font-weight: 600; }
        .st-gd.pos { color: var(--green); }
        .st-gd.neg { color: var(--red); }

        .standings-legend {
            display: flex;
            gap: 18px;
            margin-top: 18px;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.65rem;
            color: var(--text-mid);
        }
        .legend-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
        }
        .legend-dot.qualify { background: var(--green); }
        .legend-dot.playoff { background: var(--gold); }

        /* ══════════════════════════════
           TOP SCORERS
        ══════════════════════════════ */
        #btn-scorers.active {
            background: linear-gradient(135deg, var(--red), #dc2626);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 4px 20px rgba(239,68,68,0.40);
        }

        .scorers-card {
            background: var(--card-bg);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--card-border);
            border-radius: 22px;
            overflow: hidden;
            animation: fadeUp 0.38s ease both;
            position: relative;
            max-width: 640px;
            margin: 0 auto;
        }

        /* ── Goal notification ── */
        .goal-notif-wrap {
            position: fixed;
            bottom: 24px;
            right: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 9999;
            pointer-events: none;
        }
        .goal-notif {
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 14px;
            background: linear-gradient(135deg, rgba(6,12,6,0.97), rgba(5,12,24,0.97));
            border: 1px solid rgba(34,197,94,0.45);
            border-radius: 18px;
            padding: 14px 16px 14px 16px;
            box-shadow: 0 8px 36px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.06);
            min-width: 230px;
            max-width: 290px;
            animation: notifIn 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: relative;
            overflow: hidden;
        }
        .goal-notif::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--green), var(--gold));
        }
        .goal-notif.leaving { animation: notifOut 0.28s ease forwards; }
        @keyframes notifIn {
            from { opacity: 0; transform: translateX(110%) scale(0.88); }
            to   { opacity: 1; transform: translateX(0) scale(1); }
        }
        @keyframes notifOut {
            from { opacity: 1; transform: translateX(0) scale(1); }
            to   { opacity: 0; transform: translateX(110%) scale(0.92); }
        }
        .notif-ball {
            font-size: 2rem;
            line-height: 1;
            flex-shrink: 0;
            filter: drop-shadow(0 0 10px rgba(34,197,94,0.7));
            animation: ballPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s both;
        }
        @keyframes ballPop {
            from { transform: scale(0) rotate(-30deg); }
            to   { transform: scale(1) rotate(0deg); }
        }
        .notif-body { flex: 1; min-width: 0; }
        .notif-label {
            font-size: 0.55rem;
            font-weight: 900;
            letter-spacing: 3.5px;
            text-transform: uppercase;
            color: var(--green);
            margin-bottom: 3px;
        }
        .notif-player {
            font-size: 0.90rem;
            font-weight: 700;
            color: var(--text-hi);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .notif-team {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 3px;
            font-size: 0.63rem;
            color: var(--text-mid);
            font-weight: 500;
        }
        .notif-team img { width: 18px; height: 12px; object-fit: cover; border-radius: 2px; }
        .notif-close {
            background: none;
            border: none;
            color: var(--text-lo);
            cursor: pointer;
            font-size: 0.9rem;
            padding: 0;
            line-height: 1;
            flex-shrink: 0;
            transition: color 0.15s;
        }
        .notif-close:hover { color: var(--text-hi); }
        .scorers-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--red), var(--orange));
        }

        .scorers-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.80rem;
        }
        .scorers-table thead th {
            padding: 8px 14px;
            text-align: center;
            font-size: 0.58rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-lo);
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .scorers-table thead th.col-player { text-align: left; }
        .scorers-table tbody tr {
            border-bottom: 1px solid rgba(255,255,255,0.04);

        .round-header.r16   { border-color: rgba(139,92,246,0.35);  color: #a78bfa; }
        .round-header.qf    { border-color: rgba(249,115,22,0.35);  color: var(--orange); }

<body>

    <div id="goal-notif-wrap" class="goal-notif-wrap"></div>

        <div class="section" id="upcoming-section" style="display:none;">

    </main>

    <script>
        const API_URL      = 'https://worldcup26.ir/get/games';
        const TEAMS_URL    = 'https://worldcup26.ir/get/teams';
        const STADIUMS_URL = 'https://worldcup26.ir/get/stadiums';

        // Populated on first fetch — keyed by lowercase English name
        let teamByName  = {};   // name_en.lower -> team object
        let stadiumById = {};   // id -> stadium object

        // Mapeamento abrangente de países (nome em inglês vindo da API -> Código ISO oficial)
        const countryCodes = {
            'argentina': 'AR',
            'algeria': 'DZ',
            'australia': 'AU',
            'austria': 'AT',
            'belgium': 'BE',
            'bosnia and herzegovina': 'BA',
            'brazil': 'BR',
            'cabo verde': 'CV',
            'cape verde': 'CV',
            'canada': 'CA',
            'qatar': 'QA',
            'colombia': 'CO',
            'south korea': 'KR',
            'ivory coast': 'CI',
            'croatia': 'HR',
            'curaçao': 'CW',
            'egypt': 'EG',
            'ecuador': 'EC',
            'spain': 'ES',
            'united states': 'US',
            'usa': 'US',
            'france': 'FR',
            'ghana': 'GH',
            'haiti': 'HT',
            'iran': 'IR',
            'iraq': 'IQ',
            'japan': 'JP',
            'jordan': 'JO',
            'morocco': 'MA',
            'mexico': 'MX',
            'new zealand': 'NZ',
            'norway': 'NO',
            'netherlands': 'NL',
            'panama': 'PA',
            'paraguay': 'PY',
            'portugal': 'PT',
            'dr congo': 'CD',
            'democratic republic of the congo': 'CD',
            'congo dr': 'CD',
            'd.r. congo': 'CD',
            'czechia': 'CZ',
            'czech republic': 'CZ',
            'senegal': 'SN',
            'south africa': 'ZA',
            'switzerland': 'CH',
            'sweden': 'SE',
            'tunisia': 'TN',
            'türkiye': 'TR',
            'turkey': 'TR',
            'uruguay': 'UY',
            'uzbekistan': 'UZ',
            'germany': 'DE',
            'saudi arabia': 'SA',
            'nigeria': 'NG',
            'venezuela': 'VE',
            'chile': 'CL',
            'peru': 'PE',
            'costa rica': 'CR',
            'honduras': 'HN',
            'jamaica': 'JM',
            'trinidad and tobago': 'TT',
            'cameroon': 'CM',
            'mali': 'ML',
            'kenya': 'KE',
            'angola': 'AO',
            'tanzania': 'TZ',
            'new caledonia': 'NC',
            'indonesia': 'ID',
            'thailand': 'TH',
            'china': 'CN',
            'china pr': 'CN',
            'china p.r.': 'CN',
            'philippines': 'PH',
            'ukraine': 'UA',
            'poland': 'PL',
            'romania': 'RO',
            'hungary': 'HU',
            'serbia': 'RS',
            'greece': 'GR',
            'denmark': 'DK',
            'finland': 'FI',
            'slovakia': 'SK',
            'slovenia': 'SI',
            'albania': 'AL',
            'iceland': 'IS',
            'northern ireland': 'GB',
            'wales': 'GB',
        };

        // flagcdn.com suporta subdivisões do Reino Unido (GB-ENG, GB-SCT) que flagsapi não suporta
        const flagcdnOverrides = {
            'england': 'gb-eng',
            'scotland': 'gb-sct',
            'wales': 'gb-wls',
            'northern ireland': 'gb-nir',
        };

        function getTeamData(teamName) {
            if (!teamName) return null;
            return teamByName[teamName.toLowerCase().trim()] || null;
        }

        function getShinyFlagUrl(teamName) {
            const t = getTeamData(teamName);
            if (t && t.flag) return t.flag; // flagcdn.com/w80/ direto da API
            if (!teamName || teamName === 'Unknown') return 'https://flagsapi.com/UN/shiny/64.png';
            const normalized = teamName.toLowerCase().trim();
            if (flagcdnOverrides[normalized]) return `https://flagcdn.com/w80/${flagcdnOverrides[normalized]}.png`;
            const code = countryCodes[normalized] || 'UN';
            return `https://flagsapi.com/${code.toUpperCase()}/shiny/64.png`;
        }

        function getFlatFlagUrl(teamName) {
            const t = getTeamData(teamName);
            if (t && t.flag) return t.flag.replace('/w80/', '/w40/');
            if (!teamName || teamName === 'Unknown') return 'https://flagcdn.com/w40/un.png';
            const normalized = teamName.toLowerCase().trim();
            if (flagcdnOverrides[normalized]) return `https://flagcdn.com/w40/${flagcdnOverrides[normalized]}.png`;
            const code = countryCodes[normalized];
            if (!code) return 'https://flagcdn.com/w40/un.png';
            return `https://flagcdn.com/w40/${code.toLowerCase()}.png`;
        }

        function getTeamCode(teamName) {
            const t = getTeamData(teamName);
            return t ? t.fifa_code : '';
        }

        const NO_GOALS_HTML = `<span style="color: #bbb; font-style: italic;">Sem gols</span>`;

        function parseScorers(scorersRaw) {
            // Captura null/undefined JS e string "null"
            if (scorersRaw == null || scorersRaw === 'null') return NO_GOALS_HTML;

            const raw = String(scorersRaw).trim();
            if (raw === '' || raw === '{}' || raw === '[]' || raw === 'null') return NO_GOALS_HTML;

            try {
                let items;
                if (raw.startsWith('[') || raw.startsWith('{')) {
                    // Formato JSON array ou objeto PostgreSQL {"name 10'","name 20'"}
                    const parsed = JSON.parse(raw);
                    items = Array.isArray(parsed) ? parsed : Object.values(parsed);
                } else {
                    items = raw.split(/,\s*/);
                }

                const lines = items
                    .map(s => String(s).replace(/[{}"]/g, '').trim())
                    .filter(s => s.length > 0)
                    .map(s => `⚽ ${s}`);

                return lines.length > 0 ? lines.join('<br>') : NO_GOALS_HTML;

            } catch (e) {
                // Fallback para formato PostgreSQL {"name 10'","name 20'"} que não é JSON válido
                const cleaned = raw.replace(/[{}"]/g, '').trim();
                if (!cleaned) return NO_GOALS_HTML;
                const lines = cleaned.split(',')
                    .map(s => s.trim())
                    .filter(s => s.length > 0)
                    .map(s => `⚽ ${s}`);
                return lines.length > 0 ? lines.join('<br>') : NO_GOALS_HTML;
            }
        }

        // UTC offsets in June (DST active in North America). Brazil has no DST (UTC-3 year-round).
        // Stadium IDs from API: 1-3 Mexico (Central), 4-6 USA Central, 7-12 USA/Canada Eastern, 13-16 USA/Canada Western
        const stadiumOffsets = {
            1: -5, 2: -5, 3: -5,   // Mexico City, Guadalajara, Monterrey → CDT (UTC-5)
            4: -5, 5: -5, 6: -5,   // Dallas, Houston, Kansas City → CDT (UTC-5)
            7: -4, 8: -4, 9: -4,   // Atlanta, Miami, Boston → EDT (UTC-4)
            10: -4, 11: -4, 12: -4, // Philadelphia, New York/NJ, Toronto → EDT (UTC-4)
            13: -7, 14: -7,         // Vancouver, Seattle → PDT (UTC-7)
            15: -7, 16: -7          // San Francisco, Los Angeles → PDT (UTC-7)
        };

        const BRASILIA_OFFSET = -3;

        function convertToBrasilia(localDateStr, stadiumId) {
            if (!localDateStr) return null;
            const parts = String(localDateStr).trim().split(' ');
            if (parts.length < 2) return null;

            const [datePart, timePart] = parts;
            const [month, day, year] = datePart.split('/').map(Number);
            const [localHours, localMinutes] = timePart.split(':').map(Number);

            const venueOffset = stadiumOffsets[Number(stadiumId)] ?? -5;

            // Convert: UTC = local - venueOffset; Brasília = UTC + BRASILIA_OFFSET
            let brasiliaHours = localHours - venueOffset + BRASILIA_OFFSET;
            const nextDay = brasiliaHours >= 24;
            const prevDay = brasiliaHours < 0;
            if (nextDay) brasiliaHours -= 24;
            if (prevDay) brasiliaHours += 24;

            const h = String(brasiliaHours).padStart(2, '0');
            const m = String(localMinutes).padStart(2, '0');
            const suffix = nextDay ? ' (+1d)' : prevDay ? ' (-1d)' : '';
            return `${h}:${m}${suffix}`;
        }

        const ROUND_META = {
            r32:   { label: 'Round of 32',      emoji: '⚔️',  cssClass: 'r32'   },
            r16:   { label: 'Oitavas de Final',  emoji: '⚔️',  cssClass: 'r16'   },
            qf:    { label: 'Quartas de Final',  emoji: '🔥',  cssClass: 'qf'    },
            sf:    { label: 'Semifinal',         emoji: '⚡',  cssClass: 'sf'    },
            third: { label: '3º Lugar',          emoji: '🥉',  cssClass: 'third' },
            final: { label: 'FINAL',             emoji: '🏆',  cssClass: 'final' },
        };
        const ROUND_ORDER = ['r32','r16','qf','sf','third','final'];

        function buildCard(game, timeString) {
            const isKnockout = game.type && game.type !== 'group';
            const rawHome = game.home_team_name_en;
            const rawAway = game.away_team_name_en;
            // "known" = time tem nome definido (não é TBD/null)
            const homeKnown = !!(rawHome && rawHome !== 'null');
            const awayKnown = !!(rawAway && rawAway !== 'null');
            const homeTeam = homeKnown ? rawHome : '';
            const awayTeam = awayKnown ? rawAway : '';
            const homeScore = (game.home_score != null && game.home_score !== 'null') ? game.home_score : 0;
            const awayScore = (game.away_score != null && game.away_score !== 'null') ? game.away_score : 0;

            const homeScorersHTML = parseScorers(game.home_scorers);
            const awayScorersHTML = parseScorers(game.away_scorers);

            const timeElapsed = String(game.time_elapsed || '').toLowerCase();
            let statusText = game.finished === "TRUE" ? "Finalizado" : "Agendado";
            let statusClass = "status";
            if (timeElapsed === "live") { statusText = "🔴 AO VIVO"; statusClass = "status live"; }

            const brasiliaTime = convertToBrasilia(game.local_date, game.stadium_id);
            const fallbackFlag = 'https://flagcdn.com/w80/un.png';

            const homeCode = getTeamCode(homeTeam);
            const awayCode = getTeamCode(awayTeam);

            const stadium = stadiumById[String(game.stadium_id)] || null;
            const stadiumHTML = stadium ? `
                <div class="card-stadium">
                    🏟️ <strong>${stadium.name_en}</strong>
                    <span class="stadium-sep">·</span> ${stadium.city_en}
                    <span class="stadium-sep">·</span> <span class="stadium-cap">${stadium.capacity.toLocaleString()} lugares</span>
                </div>` : '';

            // Card title: for knockout show round name; for group show group+round
            const roundMeta = ROUND_META[game.type];
            const cardTitle = isKnockout && roundMeta
                ? `${roundMeta.emoji} ${roundMeta.label}`
                : `Grupo ${game.group || '-'} · Rodada ${game.matchday || '-'}`;

            // Flag/team blocks — support TBD teams
            function teamBlock(name, label, isKnown, code) {
                const flag = isKnown
                    ? `<div class="flag-ring"><img class="flag" src="${getShinyFlagUrl(name)}" onerror="this.src='${fallbackFlag}'" alt="${name}"></div>`
                    : `<div class="flag-tbd">?</div>`;
                const displayName = (isKnown ? name : (label || name));
                const nameEl = isKnown
                    ? `<div class="team-name">${displayName}</div>${code ? `<div class="team-code">${code}</div>` : ''}`
                    : `<div class="team-tbd">${displayName}</div>`;
                return `<div class="team-box">${flag}${nameEl}</div>`;
            }

            const card = document.createElement('div');
            card.className = 'scoreboard-card';
            card.innerHTML = `
                <div class="card-header">
                    <div class="title">${cardTitle}</div>
                    ${brasiliaTime ? `<div class="match-time">🕐 ${brasiliaTime} (BRT)</div>` : ''}
                </div>

                <div class="match-container">
                    ${teamBlock(homeTeam, game.home_team_label, !!homeKnown, homeCode)}
                    <div class="score-wrapper">
                        <div class="score-display">${homeScore}&nbsp;–&nbsp;${awayScore}</div>
                    </div>
                    ${teamBlock(awayTeam, game.away_team_label, !!awayKnown, awayCode)}
                </div>

                <div class="scorers-container">
                    <div class="scorers-side">${homeScorersHTML}</div>
                    <div class="scorers-side away">${awayScorersHTML}</div>
                </div>

                ${stadiumHTML}

                <div class="card-footer">
                    <span class="${statusClass}">${statusText}</span>
                    <div class="update-time">sync ${timeString}</div>
                </div>
            `;
            return card;
        }

        function toggleSection(key) {
            const section = document.getElementById(`${key}-section`);
            const btn = document.getElementById(`btn-${key}`);
            const isVisible = section.style.display !== 'none';
            section.style.display = isVisible ? 'none' : 'block';
            btn.classList.toggle('active', !isVisible);
        }

        function extractScorerItems(raw) {
            if (raw == null || raw === 'null') return [];
            const s = String(raw).trim();
            if (!s || s === '{}' || s === '[]') return [];
            let items = [];
            try {
                if (s.startsWith('[') || s.startsWith('{')) {
                    const parsed = JSON.parse(s);
                    items = Array.isArray(parsed) ? parsed : Object.values(parsed);
                } else {
                    items = s.split(/,\s*/);
                }
            } catch {
                items = s.replace(/[{}"]/g, '').split(',');
            }
            return items.map(x => String(x).replace(/[{}"]/g, '').trim()).filter(Boolean);
        }

        function parseGoalEntry(item) {
            // Minutes look like: 10' | 45+2' | 90+3'
            const minuteRe = /\d+(?:\+\d+)?'/g;
            const minutes = item.match(minuteRe) || [];
            const name = item.replace(minuteRe, '').trim().replace(/\s+/g, ' ');
            return { name, goals: minutes.length || 1 };
        }

        function normalizeName(name) {
            return name.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
        }

        // Usa o sobrenome (última palavra) como chave para agrupar
        // "Mbappé" e "Kylian Mbappé" viram ambos "mbappe||france"
        function scorerKey(name, team) {
            const parts = normalizeName(name).split(' ');
            const lastName = parts[parts.length - 1];
            return `${lastName}||${normalizeName(team || '')}`;
        }

        let prevScorerMap = null;

        function showGoalNotif(playerName, teamName) {
            const wrap = document.getElementById('goal-notif-wrap');
            const flagUrl = getFlatFlagUrl(teamName);
            const el = document.createElement('div');
            el.className = 'goal-notif';
            el.innerHTML = `
                <div class="notif-ball">⚽</div>
                <div class="notif-body">
                    <div class="notif-label">Goool!</div>
                    <div class="notif-player">${playerName}</div>
                    <div class="notif-team">
                        <img src="${flagUrl}" onerror="this.src='https://flagcdn.com/w40/un.png'" alt="">
                        ${teamName}
                    </div>
                </div>
                <button class="notif-close" onclick="dismissNotif(this.closest('.goal-notif'))">✕</button>`;
            wrap.appendChild(el);
            el._timer = setTimeout(() => dismissNotif(el), 5500);
        }

        function dismissNotif(el) {
            if (!el || el.classList.contains('leaving')) return;
            clearTimeout(el._timer);
            el.classList.add('leaving');
            setTimeout(() => el.remove(), 280);
        }

        function checkGoalNotifs(scorerList) {
            const current = {};
            scorerList.forEach(s => { current[scorerKey(s.name, s.team)] = s; });
            if (prevScorerMap !== null) {
                Object.entries(current).forEach(([key, s]) => {
                    const prev = prevScorerMap[key];
                    const added = s.goals - (prev ? prev.goals : 0);
                    for (let i = 0; i < added; i++) showGoalNotif(s.name, s.team);
                });
            }
            prevScorerMap = current;
        }

        function computeTopScorers(games) {
            const map = {};
            const relevant = games.filter(g =>
                g.finished === "TRUE" || String(g.time_elapsed || '').toLowerCase() === 'live'
            );
            relevant.forEach(game => {
                const sides = [
                    { raw: game.home_scorers, team: game.home_team_name_en },
                    { raw: game.away_scorers, team: game.away_team_name_en }
                ];
                sides.forEach(({ raw, team }) => {
                    extractScorerItems(raw).forEach(item => {
                        const { name, goals } = parseGoalEntry(item);
                        if (!name) return;
                        const key = scorerKey(name, team || '');
                        if (!map[key]) {
                            map[key] = { name, team: team || '', goals: 0 };
                        } else if (name.length > map[key].name.length) {
                            map[key].name = name;
                        }
                        map[key].goals += goals;
                    });
                });
            });
            return Object.values(map)
                .filter(s => s.goals > 0)
                .sort((a, b) => b.goals - a.goals || a.name.localeCompare(b.name));
        }

        function renderTopScorers(games) {
            const container = document.getElementById('scorers-container');
            const list = computeTopScorers(games);

            checkGoalNotifs(list);

            if (list.length === 0) {
                container.innerHTML = '<div class="no-games" style="border:none;">Nenhum gol marcado ainda.</div>';
                return;
            }

            let prevGoals = -1, rank = 0, displayRank = 0;
            const rows = list.map((s, i) => {
                rank++;
                if (s.goals !== prevGoals) { displayRank = rank; prevGoals = s.goals; }
                const rankClass = displayRank === 1 ? 'gold' : displayRank === 2 ? 'silver' : displayRank === 3 ? 'bronze' : '';
                const flagUrl = getFlatFlagUrl(s.team);
                return `
                    <tr>
                        <td class="sc-rank ${rankClass}">${displayRank}º</td>
                        <td class="col-player">
                            <div class="sc-player-cell">
                                <img class="sc-flag" src="${flagUrl}" onerror="this.src='https://flagcdn.com/w40/un.png'" alt="${s.team}">
                                <div class="sc-player-info">
                                    <span class="sc-name">${s.name}</span>
                                    <span class="sc-team">${s.team}</span>
                                </div>
                            </div>
                        </td>
                        <td class="sc-goals">${s.goals}</td>
                    </tr>`;
            }).join('');

            container.innerHTML = `
                <table class="scorers-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th class="col-player">Jogador</th>
                            <th title="Gols">⚽</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>`;
        }

        function renderKnockout(games, timeString) {
            const container = document.getElementById('knockout-container');
            const koGames = games.filter(g => g.type && g.type !== 'group');

            if (koGames.length === 0) {
                container.innerHTML = '<div class="no-games">Nenhum jogo do mata-mata ainda.</div>';
                return;
            }

            // Group by round type in defined order
            const byRound = {};
            koGames.forEach(g => {
                if (!byRound[g.type]) byRound[g.type] = [];
                byRound[g.type].push(g);
            });

            container.innerHTML = '';

            ROUND_ORDER.filter(r => byRound[r]).forEach(roundKey => {
                const meta = ROUND_META[roundKey];
                const roundGames = byRound[roundKey];

                const section = document.createElement('div');
                section.className = `round-group round-${meta.cssClass}`;

                const header = document.createElement('div');
                header.className = `round-header ${meta.cssClass}`;
                header.textContent = `${meta.emoji}  ${meta.label}`;
                section.appendChild(header);

                const grid = document.createElement('div');
                grid.className = 'dashboard';
                roundGames.forEach(g => grid.appendChild(buildCard(g, timeString)));
                section.appendChild(grid);
                container.appendChild(section);
            });
        }

        function computeStandings(games) {
            const groups = {};

            // Register all teams per group from all scheduled games
            games.forEach(game => {
                const group = game.group;
                if (!group) return;
                const home = game.home_team_name_en;
                const away = game.away_team_name_en;
                if (!home || !away) return;
                if (!groups[group]) groups[group] = {};
                if (!groups[group][home]) groups[group][home] = { mp: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 };
                if (!groups[group][away]) groups[group][away] = { mp: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 };
            });

            // Accumulate stats from finished games only
            games.filter(g => g.finished === "TRUE").forEach(game => {
                const group = game.group;
                const home = game.home_team_name_en;
                const away = game.away_team_name_en;
                const hs = parseInt(game.home_score);
                const as_ = parseInt(game.away_score);
                if (!group || !groups[group] || !home || !away || isNaN(hs) || isNaN(as_)) return;

                const ht = groups[group][home];
                const at = groups[group][away];
                ht.mp++; at.mp++;
                ht.gf += hs; ht.ga += as_;
                at.gf += as_; at.ga += hs;

                if (hs > as_)      { ht.w++; ht.pts += 3; at.l++; }
                else if (hs < as_) { at.w++; at.pts += 3; ht.l++; }
                else               { ht.d++; ht.pts++;    at.d++; at.pts++; }
            });

            return groups;
        }

        function renderStandings(games) {
            const container = document.getElementById('standings-container');
            const groups = computeStandings(games);
            const sortedGroupNames = Object.keys(groups).sort();

            if (sortedGroupNames.length === 0) {
                container.innerHTML = '<div class="no-games">Nenhum grupo encontrado.</div>';
                return;
            }

            const grid = document.createElement('div');
            grid.className = 'standings-grid';

            sortedGroupNames.forEach(groupName => {
                const teamMap = groups[groupName];
                const teamList = Object.entries(teamMap).map(([name, s]) => ({
                    name, ...s, gd: s.gf - s.ga
                })).sort((a, b) => {
                    if (b.pts !== a.pts) return b.pts - a.pts;
                    if (b.gd  !== a.gd)  return b.gd  - a.gd;
                    if (b.gf  !== a.gf)  return b.gf  - a.gf;
                    return a.name.localeCompare(b.name);
                });

                const rows = teamList.map((team, i) => {
                    const pos = i + 1;
                    const posClass = pos <= 2 ? 'qualify' : pos === 3 ? 'playoff' : '';
                    const gdStr = team.gd > 0 ? `+${team.gd}` : String(team.gd);
                    const gdClass = team.gd > 0 ? 'pos' : team.gd < 0 ? 'neg' : '';
                    const flagUrl = getFlatFlagUrl(team.name);
                    const code = getTeamCode(team.name);
                    return `
                        <tr>
                            <td class="st-pos ${posClass}">${pos}</td>
                            <td class="col-team">
                                <div class="st-team-cell">
                                    <img class="st-flag" src="${flagUrl}" onerror="this.src='https://flagcdn.com/w40/un.png'" alt="${team.name}">
                                    <span class="st-name">${team.name}</span>
                                    ${code ? `<span style="font-size:0.58rem;color:var(--text-lo);font-weight:700;letter-spacing:1px;">${code}</span>` : ''}
                                </div>
                            </td>
                            <td class="st-pts">${team.pts}</td>
                            <td>${team.mp}</td>
                            <td>${team.w}</td>
                            <td>${team.d}</td>
                            <td>${team.l}</td>
                            <td>${team.gf}</td>
                            <td>${team.ga}</td>
                            <td class="st-gd ${gdClass}">${gdStr}</td>
                        </tr>`;
                }).join('');

                const card = document.createElement('div');
                card.className = 'group-table';
                card.innerHTML = `
                    <div class="group-table-header">Grupo ${groupName}</div>
                    <div class="table-scroll-wrap">
                        <table class="standings-table">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th class="col-team">Seleção</th>
                                    <th title="Pontos">Pts</th>
                                    <th title="Jogos">J</th>
                                    <th title="Vitórias">V</th>
                                    <th title="Empates">E</th>
                                    <th title="Derrotas">D</th>
                                    <th title="Gols Pró">GP</th>
                                    <th title="Gols Contra">GC</th>
                                    <th title="Saldo de Gols">SG</th>
                                </tr>
                            </thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>`;
                grid.appendChild(card);
            });

            container.innerHTML = '';
            container.appendChild(grid);
        }

        function renderGroupedGames(games, container, timeString, ascending) {
            const grouped = {};
            games.forEach(game => {
                const datePart = String(game.local_date || '').split(' ')[0];
                if (!datePart) return;
                if (!grouped[datePart]) grouped[datePart] = [];
                grouped[datePart].push(game);
            });

            const sortedDates = Object.keys(grouped).sort((a, b) => {
                const [am, ad, ay] = a.split('/').map(Number);
                const [bm, bd, by] = b.split('/').map(Number);
                const diff = new Date(by, bm - 1, bd) - new Date(ay, am - 1, ad);
                return ascending ? -diff : diff;
            });

            container.innerHTML = '';
            sortedDates.forEach(dateStr => {
                const [m, d, y] = dateStr.split('/').map(Number);
                const label = new Date(y, m - 1, d).toLocaleDateString('pt-BR', {
                    weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
                });
                const groupEl = document.createElement('div');
                groupEl.className = 'date-group';
                groupEl.innerHTML = `<div class="date-group-header">${label}</div>`;
                const grid = document.createElement('div');
                grid.className = 'dashboard';
                grouped[dateStr].forEach(game => grid.appendChild(buildCard(game, timeString)));
                groupEl.appendChild(grid);
                container.appendChild(groupEl);
            });
        }

        async function fetchDailyScores() {
            const todayDashboard    = document.getElementById('today-dashboard');
            const pastDashboard     = document.getElementById('past-dashboard');
            const upcomingDashboard = document.getElementById('upcoming-dashboard');
            const toggleBar         = document.getElementById('toggle-bar');
            const btnPast           = document.getElementById('btn-past');
            const btnUpcoming       = document.getElementById('btn-upcoming');
            const displayDate       = document.getElementById('display-date');

            const today = new Date();
            const todayDate = new Date(today.getFullYear(), today.getMonth(), today.getDate());
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day   = String(today.getDate()).padStart(2, '0');
            const year  = today.getFullYear();
            const usTodayStr = `${month}/${day}/${year}`;

            displayDate.innerText = today.toLocaleDateString('pt-BR', {
                weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
            }).toUpperCase();

            try {
                const [gamesRes, teamsRes, stadiumsRes] = await Promise.all([
                    fetch(API_URL),
                    fetch(TEAMS_URL),
                    fetch(STADIUMS_URL)
                ]);
                if (!gamesRes.ok) throw new Error('API did not respond.');

                const data   = await gamesRes.json();
                const teams  = await teamsRes.json().catch(() => []);
                const stadiums = await stadiumsRes.json().catch(() => []);

                // Build lookup maps (only once per fetch cycle)
                teamByName  = {};
                stadiumById = {};
                (Array.isArray(teams) ? teams : []).forEach(t => {
                    if (t.name_en) teamByName[t.name_en.toLowerCase().trim()] = t;
                });
                (Array.isArray(stadiums) ? stadiums : []).forEach(s => {
                    if (s.id) stadiumById[String(s.id)] = s;
                });

                const games = Array.isArray(data) ? data : data.games || [];
                const timeString = new Date().toLocaleTimeString('pt-BR', { hour12: false });

                const todaysGames = games.filter(game =>
                    String(game.local_date || '').trim().startsWith(usTodayStr)
                );

                const pastGames = games.filter(game => {
                    const dp = String(game.local_date || '').trim().split(' ')[0];
                    if (!dp) return false;
                    const [m, d, y] = dp.split('/').map(Number);
                    return new Date(y, m - 1, d) < todayDate;
                });

                const upcomingGames = games.filter(game => {
                    const dp = String(game.local_date || '').trim().split(' ')[0];
                    if (!dp) return false;
                    const [m, d, y] = dp.split('/').map(Number);
                    return new Date(y, m - 1, d) > todayDate;
                });

                // --- Today ---
                todayDashboard.innerHTML = '';
                if (todaysGames.length === 0) {
                    todayDashboard.innerHTML = `<div class="no-games">Nenhuma partida hoje.</div>`;
                } else {
                    todaysGames.forEach(game => todayDashboard.appendChild(buildCard(game, timeString)));
                }

                // --- Toggle bar ---
                const hasPast     = pastGames.length > 0;
                const hasUpcoming = upcomingGames.length > 0;
                toggleBar.style.display = 'flex';

                document.getElementById('count-past').textContent     = pastGames.length;
                document.getElementById('count-upcoming').textContent = upcomingGames.length;
                btnPast.disabled     = !hasPast;
                btnUpcoming.disabled = !hasUpcoming;

                // --- Past (rendered once, hidden by default) ---
                if (hasPast) renderGroupedGames(pastGames, pastDashboard, timeString, false);

                // --- Upcoming (rendered once, hidden by default) ---
                if (hasUpcoming) renderGroupedGames(upcomingGames, upcomingDashboard, timeString, true);

                // --- Knockout ---
                renderKnockout(games, timeString);

                // --- Standings ---
                renderStandings(games);

                // --- Top Scorers ---
                renderTopScorers(games);

            } catch (error) {
                console.error(error);
                todayDashboard.innerHTML = `<div class="error">Erro: ${error.message}</div>`;
            }
        }

        fetchDailyScores();
        setInterval(fetchDailyScores, 15000);
    </script>
