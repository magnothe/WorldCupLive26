<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Cup 2026 - Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            color: #333;
            margin-bottom: 5px;
            text-transform: uppercase;
            font-size: 1.8rem;
            letter-spacing: 2px;
        }

        .current-date {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 30px;
            font-weight: 500;
        }

        .dashboard {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
            width: 100%;
            max-width: 1200px;
        }

        .scoreboard-card {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            text-align: center;
            flex: 1;
            min-width: 360px;
            max-width: 440px;
            box-sizing: border-box;
            border-top: 5px solid #1a73e8;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .title {
            font-size: 0.8rem;
            color: #999;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .match-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .team-box {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .flag {
            width: 64px;
            height: 64px;
            object-fit: contain;
        }

        .team-name {
            font-size: 1.1rem;
            font-weight: bold;
            color: #333;
            word-break: break-word;
        }

        .score-display {
            flex: 1;
            font-size: 2.5rem;
            font-weight: 800;
            color: #1a73e8;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .scorers-container {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 0.8rem;
            color: #444;
            text-align: left;
            gap: 15px;
            line-height: 1.4;
        }

        .scorers-side {
            flex: 1;
            word-break: break-word;
        }

        .scorers-side.away {
            text-align: right;
        }

        .status {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #28a745;
            font-weight: 600;
            background-color: #e8f5e9;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            text-transform: uppercase;
        }

        .status.live {
            color: #dc3545;
            background-color: #ffebee;
        }

        .match-time {
            margin-top: 6px;
            font-size: 0.85rem;
            color: #555;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .match-time .clock-icon {
            margin-right: 4px;
        }

        .update-time {
            margin-top: 15px;
            font-size: 0.7rem;
            color: #bbb;
        }

        .section {
            width: 100%;
            max-width: 1200px;
            margin-bottom: 50px;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #1a73e8;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .date-group {
            margin-bottom: 30px;
        }

        .date-group-header {
            font-size: 0.95rem;
            font-weight: 600;
            color: #444;
            margin-bottom: 15px;
            padding: 8px 14px;
            background: #e8f0fe;
            border-radius: 8px;
            text-transform: capitalize;
            border-left: 4px solid #1a73e8;
        }

        .no-games, .loading, .error {
            font-size: 1.2rem;
            color: #666;
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 500px;
        }

        .error { color: #dc3545; }
    </style>
</head>
<body>

    <h1>World Cup 2026</h1>
    <div class="current-date" id="display-date">Loading schedule...</div>

    <div class="section" id="today-section">
        <div class="section-title">📅 Jogos de Hoje</div>
        <div class="dashboard" id="today-dashboard">
            <div class="loading">Carregando jogos...</div>
        </div>
    </div>

    <div class="section" id="past-section" style="display:none;">
        <div class="section-title">📋 Resultados Anteriores</div>
        <div id="past-dashboard"></div>
    </div>

    <script>
        const API_URL = 'https://worldcup26.ir/get/games';

        // Mapeamento abrangente de países (nome em inglês vindo da API -> Código ISO oficial)
       const countryCodes = {
    'argentina': 'AR',
    'algeria': 'DZ',
    'australia': 'AU',
    'austria': 'AT',
    'belgium': 'BE',
    'bosnia and herzegovina': 'BA',
    'brazil': 'BR',
    'cabo verde': 'CV',
    'canada': 'CA',
    'qatar': 'QA',
    'colombia': 'CO',
    'south korea': 'KR',
    'ivory coast': 'CI',
    'croatia': 'HR',
    'curaçao': 'CW',
    'egypt': 'EG',
    'ecuador': 'EC',
    'scotland': 'GB-SCT', // Nota: FlagsAPI costuma usar GB para o Reino Unido, ou o código específico se suportado
    'spain': 'ES',
    'united states': 'US',
    'france': 'FR',
    'ghana': 'GH',
    'haiti': 'HT',
    'england': 'GB-ENG',  // Nota: Se a FlagsAPI não carregar, use 'GB' como fallback geral
    'iran': 'IR',
    'iraq': 'IQ',
    'japan': 'JP',
    'jordan': 'JO',
    'morocco': 'MA',
    'mexico': 'MX',
    'new zealand': 'NZ',
    'norway': 'NO',
    'netherlands': 'NL',
    'panama': 'PA',
    'paraguay': 'PY',
    'portugal': 'PT',
    'dr congo': 'CD',
    'czechia': 'CZ',
    'senegal': 'SN',
    'south africa': 'ZA',
    'switzerland': 'CH',
    'sweden': 'SE',
    'tunisia': 'TN',
    'türkiye': 'TR',
    'uruguay': 'UY',
    'uzbekistan': 'UZ',
    'germany': 'DE',
    'saudi arabia': 'SA'
};

        // Função padronizada para usar unicamente a flagsapi com estilo shiny
        function getShinyFlagUrl(teamName) {
            if (!teamName || teamName === 'Unknown') return 'https://flagsapi.com/UN/shiny/64.png';
            
            const normalized = teamName.toLowerCase().trim();
            const code = countryCodes[normalized] || 'UN'; // Retorna 'UN' (bandeira genérica do mundo) se não listado acima
            
            return `https://flagsapi.com/${code.toUpperCase()}/shiny/64.png`;
        }

        // Remove as aspas, colchetes, chaves e limpa o texto bruto de gols
        function parseScorers(scorersRaw) {
            if (!scorersRaw || scorersRaw === "null" || scorersRaw.trim() === "") {
                return `<span style="color: #bbb; font-style: italic;">No goals</span>`;
            }

            try {
                let scorersArray = scorersRaw;
                if (typeof scorersRaw === 'string') {
                    const cleanString = scorersRaw.trim();
                    if (cleanString.startsWith('[') || cleanString.startsWith('{')) {
                        scorersArray = JSON.parse(cleanString);
                    } else {
                        scorersArray = cleanString.split(/,|\n/);
                    }
                }

                if (Array.isArray(scorersArray)) {
                    return scorersArray
                        .map(scorer => `⚽ ${String(scorer).replace(/[{}"]/g, '').trim()}`)
                        .join('<br>');
                } else if (typeof scorersArray === 'object') {
                    return Object.values(scorersArray)
                        .map(scorer => `⚽ ${String(scorer).replace(/[{}"]/g, '').trim()}`)
                        .join('<br>');
                }

                return `⚽ ${String(scorersRaw).replace(/[{}"]/g, '').trim()}`;

            } catch (e) {
                return `⚽ ${String(scorersRaw).replace(/[{}"]/g, '').replace(/,/g, '<br>⚽ ').trim()}`;
            }
        }

        // UTC offsets in June (DST active in North America). Brazil has no DST (UTC-3 year-round).
        // Stadium IDs from API: 1-3 Mexico (Central), 4-6 USA Central, 7-12 USA/Canada Eastern, 13-16 USA/Canada Western
        const stadiumOffsets = {
            1: -5, 2: -5, 3: -5,   // Mexico City, Guadalajara, Monterrey → CDT (UTC-5)
            4: -5, 5: -5, 6: -5,   // Dallas, Houston, Kansas City → CDT (UTC-5)
            7: -4, 8: -4, 9: -4,   // Atlanta, Miami, Boston → EDT (UTC-4)
            10: -4, 11: -4, 12: -4, // Philadelphia, New York/NJ, Toronto → EDT (UTC-4)
            13: -7, 14: -7,         // Vancouver, Seattle → PDT (UTC-7)
            15: -7, 16: -7          // San Francisco, Los Angeles → PDT (UTC-7)
        };

        const BRASILIA_OFFSET = -3;

        function convertToBrasilia(localDateStr, stadiumId) {
            if (!localDateStr) return null;
            const parts = String(localDateStr).trim().split(' ');
            if (parts.length < 2) return null;

            const [datePart, timePart] = parts;
            const [month, day, year] = datePart.split('/').map(Number);
            const [localHours, localMinutes] = timePart.split(':').map(Number);

            const venueOffset = stadiumOffsets[Number(stadiumId)] ?? -5;

            // Convert: UTC = local - venueOffset; Brasília = UTC + BRASILIA_OFFSET
            let brasiliaHours = localHours - venueOffset + BRASILIA_OFFSET;
            const nextDay = brasiliaHours >= 24;
            const prevDay = brasiliaHours < 0;
            if (nextDay) brasiliaHours -= 24;
            if (prevDay) brasiliaHours += 24;

            const h = String(brasiliaHours).padStart(2, '0');
            const m = String(localMinutes).padStart(2, '0');
            const suffix = nextDay ? ' (+1d)' : prevDay ? ' (-1d)' : '';
            return `${h}:${m}${suffix}`;
        }

        function buildCard(game, timeString) {
            const homeTeam = game.home_team_name_en || 'Unknown';
            const awayTeam = game.away_team_name_en || 'Unknown';
            const homeScore = game.home_score !== undefined ? game.home_score : '-';
            const awayScore = game.away_score !== undefined ? game.away_score : '-';

            const homeScorersHTML = parseScorers(game.home_scorers);
            const awayScorersHTML = parseScorers(game.away_scorers);

            const timeElapsed = String(game.time_elapsed || '').toLowerCase();
            let statusText = game.finished === "TRUE" ? "Finalizado" : "Agendado";
            let statusClass = "status";

            if (timeElapsed === "live") {
                statusText = "🔴 AO VIVO";
                statusClass = "status live";
            }

            const brasiliaTime = convertToBrasilia(game.local_date, game.stadium_id);
            const matchTimeHTML = brasiliaTime
                ? `<div class="match-time"><span class="clock-icon">🕐</span>${brasiliaTime} (Brasília)</div>`
                : '';

            const card = document.createElement('div');
            card.className = 'scoreboard-card';
            card.innerHTML = `
                <div>
                    <div class="title">Grupo ${game.group || '-'} - Rodada ${game.matchday || '-'}</div>
                    ${matchTimeHTML}
                    <div class="match-container">
                        <div class="team-box">
                            <img class="flag" src="${getShinyFlagUrl(homeTeam)}" onerror="this.src='https://flagsapi.com/UN/shiny/64.png'" alt="Flag">
                            <div class="team-name">${homeTeam}</div>
                        </div>
                        <div class="score-display">${homeScore} - ${awayScore}</div>
                        <div class="team-box">
                            <img class="flag" src="${getShinyFlagUrl(awayTeam)}" onerror="this.src='https://flagsapi.com/UN/shiny/64.png'" alt="Flag">
                            <div class="team-name">${awayTeam}</div>
                        </div>
                    </div>
                    <div class="scorers-container">
                        <div class="scorers-side">${homeScorersHTML}</div>
                        <div class="scorers-side away">${awayScorersHTML}</div>
                    </div>
                </div>
                <div>
                    <div><span class="${statusClass}">${statusText}</span></div>
                    <div class="update-time">Última sync: ${timeString}</div>
                </div>
            `;
            return card;
        }

        async function fetchDailyScores() {
            const todayDashboard = document.getElementById('today-dashboard');
            const pastDashboard = document.getElementById('past-dashboard');
            const pastSection = document.getElementById('past-section');
            const displayDate = document.getElementById('display-date');

            const today = new Date();
            const todayDate = new Date(today.getFullYear(), today.getMonth(), today.getDate());
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            const year = today.getFullYear();
            const usTodayStr = `${month}/${day}/${year}`;

            displayDate.innerText = `${day}/${month}/${year}`;

            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('API did not respond.');

                const data = await response.json();
                const games = Array.isArray(data) ? data : data.games || [];
                const timeString = new Date().toLocaleTimeString('pt-BR', { hour12: false });

                const todaysGames = games.filter(game =>
                    String(game.local_date || '').trim().startsWith(usTodayStr)
                );

                const pastGames = games.filter(game => {
                    const datePart = String(game.local_date || '').trim().split(' ')[0];
                    if (!datePart) return false;
                    const [m, d, y] = datePart.split('/').map(Number);
                    return new Date(y, m - 1, d) < todayDate;
                });

                // --- Today ---
                todayDashboard.innerHTML = '';
                if (todaysGames.length === 0) {
                    todayDashboard.innerHTML = `<div class="no-games">Nenhuma partida hoje (${day}/${month}/${year}).</div>`;
                } else {
                    todaysGames.forEach(game => todayDashboard.appendChild(buildCard(game, timeString)));
                }

                // --- Past ---
                if (pastGames.length === 0) {
                    pastSection.style.display = 'none';
                    return;
                }

                const grouped = {};
                pastGames.forEach(game => {
                    const datePart = String(game.local_date || '').split(' ')[0];
                    if (!grouped[datePart]) grouped[datePart] = [];
                    grouped[datePart].push(game);
                });

                const sortedDates = Object.keys(grouped).sort((a, b) => {
                    const [am, ad, ay] = a.split('/').map(Number);
                    const [bm, bd, by] = b.split('/').map(Number);
                    return new Date(by, bm - 1, bd) - new Date(ay, am - 1, ad);
                });

                pastDashboard.innerHTML = '';
                sortedDates.forEach(dateStr => {
                    const [m, d, y] = dateStr.split('/').map(Number);
                    const label = new Date(y, m - 1, d).toLocaleDateString('pt-BR', {
                        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
                    });

                    const groupEl = document.createElement('div');
                    groupEl.className = 'date-group';
                    groupEl.innerHTML = `<div class="date-group-header">${label}</div>`;

                    const grid = document.createElement('div');
                    grid.className = 'dashboard';
                    grouped[dateStr].forEach(game => grid.appendChild(buildCard(game, timeString)));

                    groupEl.appendChild(grid);
                    pastDashboard.appendChild(groupEl);
                });

                pastSection.style.display = 'block';

            } catch (error) {
                console.error(error);
                todayDashboard.innerHTML = `<div class="error">Erro: ${error.message}</div>`;
            }
        }

        fetchDailyScores();
        setInterval(fetchDailyScores, 15000);
    </script>
</body>
</html>
