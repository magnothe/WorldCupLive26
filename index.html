<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FootballLive — Brasileirão, Premier League, La Liga, Serie A, Bundesliga e Ligue 1</title>
    <meta name="description" content="Jogos ao vivo, resultados, classificação, artilharia e cartões do Brasileirão Séries A, B e C e das cinco grandes ligas da Europa.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div id="notif-wrap" class="notif-wrap"></div>

    <header class="masthead">
        <div class="shell mast-inner">
            <h1 class="wordmark">Football<em>Live</em></h1>
            <p class="mast-meta">
                <span id="today-label">—</span>
                <span class="sep"></span>
                <span id="sync-label">sincronizando</span>
            </p>
        </div>
    </header>

    <nav class="league-bar" aria-label="Selecionar campeonato">
        <div class="shell league-bar-inner" id="league-nav"></div>
    </nav>

    <main class="shell">

        <div class="lead">
            <h2 class="lead-title" id="lead-title">—</h2>
            <p class="lead-sub" id="lead-sub"></p>
        </div>

        <nav class="tabs" id="tabs" aria-label="Seções"></nav>

        <section class="view" id="view-today"     data-tab="today"></section>
        <section class="view" id="view-past"      data-tab="past" hidden></section>
        <section class="view" id="view-upcoming"  data-tab="upcoming" hidden></section>

        <section class="view" id="view-standings" data-tab="standings" hidden>
            <div id="standings-container"></div>
            <div class="legend" id="standings-legend"></div>
        </section>

        <section class="view" id="view-scorers" data-tab="scorers" hidden>
            <div class="panel narrow">
                <h3 class="panel-head">Artilharia</h3>
                <div id="scorers-container"></div>
            </div>
        </section>

        <section class="view" id="view-cards" data-tab="cards" hidden>
            <div class="panel narrow">
                <h3 class="panel-head">Cartões</h3>
                <div id="cards-container"></div>
            </div>
            <p class="note">Somados a partir dos lances de cada partida publicados pela ESPN. A coluna V inclui vermelho direto e segundo amarelo.</p>
        </section>

    </main>

    <footer class="site-footer">
        <div class="shell">
            Dados de <strong>ESPN</strong> — placares, escalações, cartões, tabelas e escudos. Sem chave de API.
        </div>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
